name: Release

# v1.2.3 형태의 태그를 push하면 macOS/Windows/Linux를 각각 빌드해서
# 패키징하고, 하나의 GitHub Release에 세 파일을 모두 첨부한다.
# 수동으로도 실행 가능(workflow_dispatch) — 이 경우 태그가 없으므로
# GITHUB_SHA 기반 임시 이름으로 릴리스를 만든다.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.1"

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --release
      - name: DMG로 패키징
        run: |
          mkdir -p dist
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app')
          hdiutil create -volname "Daylight Commander" -srcfolder "$APP_PATH" \
            -ov -format UDZO dist/DaylightCommander-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/DaylightCommander-macos.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: zip로 패키징
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $releaseDir = Get-ChildItem -Path build\windows -Recurse -Directory -Filter Release |
            Select-Object -First 1
          Compress-Archive -Path "$($releaseDir.FullName)\*" -DestinationPath dist\DaylightCommander-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/DaylightCommander-windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: 리눅스 데스크톱 빌드 의존성 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake git ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: tar.gz로 패키징
        run: |
          mkdir -p dist
          BUNDLE_DIR=$(find build/linux -type d -name bundle | head -n1)
          tar -czf dist/DaylightCommander-linux.tar.gz -C "$BUNDLE_DIR" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: dist/DaylightCommander-linux.tar.gz

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: GitHub Release 생성
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="manual-$(date +%Y%m%d%H%M%S)"
          fi
          gh release create "$TAG" \
            artifacts/macos-dmg/*.dmg \
            artifacts/windows-zip/*.zip \
            artifacts/linux-tarball/*.tar.gz \
            --title "$TAG" \
            --generate-notes
