name: Release

# v1.2.3 형태의 태그를 push하면 macOS/Windows/Linux를 각각 빌드해서
# 패키징하고, 하나의 GitHub Release에 세 파일을 모두 첨부한다.
# 수동으로도 실행 가능(workflow_dispatch) — 이 경우 태그가 없으므로
# GITHUB_SHA 기반 임시 이름으로 릴리스를 만든다.
#
# macOS 빌드는 Apple Developer ID로 서명 + 공증(notarization)한다. 저장소
# Secrets에 MACOS_CERTIFICATE_P12_BASE64 / MACOS_CERTIFICATE_PASSWORD /
# MACOS_KEYCHAIN_PASSWORD / APPLE_ID / APPLE_ID_PASSWORD / APPLE_TEAM_ID가
# 설정되어 있어야 한다 — 설정 방법은 RELEASING.md 참고.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.1"

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Developer ID 인증서를 임시 키체인으로 가져오기
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12
      - name: 서명 + 공증 + DMG로 패키징
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p dist
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app')
          IDENTITY=$(security find-identity -v -p codesigning build.keychain \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::키체인에서 Developer ID Application 인증서를 찾지 못함"
            exit 1
          fi
          # --options runtime(하드닝된 런타임)은 공증에 필수. --timestamp로
          # 보안 타임스탬프도 같이 남긴다 (역시 공증 요건).
          codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" "$APP_PATH"
          hdiutil create -volname "Daylight Commander" -srcfolder "$APP_PATH" \
            -ov -format UDZO dist/DaylightCommander-macos.dmg
          xcrun notarytool submit dist/DaylightCommander-macos.dmg \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_ID_PASSWORD" \
            --wait
          xcrun stapler staple dist/DaylightCommander-macos.dmg
      - name: 임시 키체인 정리
        if: always()
        run: security delete-keychain build.keychain || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/DaylightCommander-macos.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: 빌드 출력 폴더 확인
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path $releaseDir)) {
            Write-Error "빌드 출력 폴더를 못 찾음: $releaseDir (Flutter 버전이 바뀌면 경로가 달라질 수 있음)"
            exit 1
          }
      - name: Inno Setup 설치
        run: choco install innosetup --no-progress -y
      - name: 설치 파일(exe)로 패키징
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" windows\installer.iss
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path dist\DaylightCommander-Setup.exe)) {
            Write-Error "Inno Setup 컴파일 실패 또는 결과물 없음"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/DaylightCommander-Setup.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: 리눅스 데스크톱 빌드 의존성 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake git ninja-build pkg-config libgtk-3-dev libsecret-1-dev libmpv-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: tar.gz로 패키징
        run: |
          mkdir -p dist
          BUNDLE_DIR=$(find build/linux -type d -name bundle | head -n1)
          tar -czf dist/DaylightCommander-linux.tar.gz -C "$BUNDLE_DIR" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: dist/DaylightCommander-linux.tar.gz

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: GitHub Release 생성
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="manual-$(date +%Y%m%d%H%M%S)"
          fi
          gh release create "$TAG" \
            artifacts/macos-dmg/*.dmg \
            artifacts/windows-installer/*.exe \
            artifacts/linux-tarball/*.tar.gz \
            --title "$TAG" \
            --notes-file .github/release-notes-header.md \
            --generate-notes
